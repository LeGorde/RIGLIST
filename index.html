<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist administrativo</title>
<style>
:root{
  --navy:#0b2a4a;--navy2:#143e6b;--blue:#2f6db5;--blue-l:#e8f0fa;--blue-xl:#f5f8fc;
  --green:#1e9e5a;--green-l:#e3f6ec;--orange:#e8890c;--orange-l:#fdf0dc;--red:#d64545;--red-l:#fbe6e6;
  --gray:#e5e9f0;--gray-d:#66758b;--text:#14233a;--bg:#fafbfd;--card:#fff;--r:14px;
  --sh:0 1px 2px rgba(11,42,74,.06),0 6px 18px rgba(11,42,74,.07);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--gray-d)}
.small{font-size:12.5px}
[hidden]{display:none!important}

/* Cabecera */
.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:16px 16px 18px}
.top-in{max-width:1000px;margin:0 auto}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px;letter-spacing:.2px}
.brand .ic{width:26px;height:26px}
.clock{text-align:right}
.clock .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.clock .d{font-size:13px;opacity:.85;text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;min-width:0}
.stat .l{font-size:12px;opacity:.8}
.stat .v{font-size:22px;font-weight:700;line-height:1.2}
.stat .v.sm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat.wide{grid-column:span 2}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:#35d07f;border-radius:99px;transition:width .5s ease}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:10px;padding:8px 14px;font-weight:600;background:var(--blue);color:#fff;transition:transform .08s,background .15s,box-shadow .15s}
.btn:hover{background:#2560a6}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--navy)}
.btn.primary:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--gray)}
.btn.ghost:hover{background:var(--blue-xl)}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#b93636}
.btn.ok{background:var(--green)}
.btn.light{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#fff}
.btn.light:hover{background:rgba(255,255,255,.24)}
.btn.light.on{background:#fff;color:var(--navy)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:focus-visible,.chk:focus-visible,.tab:focus-visible,.ibtn:focus-visible{outline:3px solid #8bb8ee;outline-offset:2px}
.ibtn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--gray);border-radius:9px;padding:5px 9px;color:var(--navy);font-size:13px;font-weight:600}
.ibtn:hover{background:var(--blue-l)}
.ibtn.on{background:var(--blue-l);border-color:#b7cfee}

/* Navegación */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--gray);box-shadow:0 2px 8px rgba(11,42,74,.04)}
.nav-in{max-width:1000px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 12px;font-weight:600;color:var(--gray-d);display:flex;align-items:center;gap:7px;white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}
.pill{background:var(--red);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.pill.o{background:var(--orange)}

main{max-width:1000px;margin:0 auto;padding:16px}
#banners{max-width:1000px;margin:0 auto;padding:12px 16px 0}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;margin-bottom:10px;border:1px solid;font-size:14px}
.banner.info{background:var(--blue-l);border-color:#c5d8f1}
.banner.warn{background:var(--orange-l);border-color:#f3d3a0}
.banner.err{background:var(--red-l);border-color:#efbcbc}
.banner .sp{flex:1;min-width:180px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=search],.toolbar select,.inp{border:1px solid var(--gray);border-radius:10px;padding:8px 11px;background:#fff;min-width:0}
.toolbar input[type=search]{flex:1;min-width:160px}
.inp:focus,.toolbar input:focus,.toolbar select:focus,textarea:focus{outline:2px solid #8bb8ee;border-color:#8bb8ee}
.chkline{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--gray-d)}

/* Tarjetas / tareas */
.card{background:var(--card);border:1px solid var(--gray);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card>.ch{padding:12px 16px;border-bottom:1px solid var(--gray);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--blue-xl)}
.card>.ch h3{font-size:15px;color:var(--navy)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--gray);border-left:4px solid var(--gray);animation:fade .25s ease}
.task:last-child{border-bottom:0}
.task.s-completada{border-left-color:var(--green);background:#fbfefc}
.task.s-vencida{border-left-color:var(--red);background:#fffafa}
.task.s-seguimiento{border-left-color:var(--orange);background:#fffcf7}
.task.s-en_curso{border-left-color:var(--blue)}
.task.s-pendiente{border-left-color:#b9c6d8}
.task.future{opacity:.7}
.task.done .t-name{text-decoration:line-through;color:var(--gray-d)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #9fb2cb;background:#fff;display:grid;place-items:center;color:#fff;padding:0;transition:all .15s}
.chk:hover{border-color:var(--navy)}
.chk[aria-checked=true]{background:var(--green);border-color:var(--green)}
.chk .ic{width:18px;height:18px;stroke-width:3}
.t-name{font-weight:600}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.t-last{font-size:13px;color:var(--gray-d);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.t-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--gray);color:var(--gray-d)}
.b.green{background:var(--green-l);color:#157a45}
.b.orange{background:var(--orange-l);color:#a85f00}
.b.red{background:var(--red-l);color:#a82f2f}
.b.blue{background:var(--blue-l);color:var(--blue)}
.b.navy{background:var(--navy);color:#fff}
.empty{padding:34px 16px;text-align:center;color:var(--gray-d)}
.sub{padding:8px 16px;font-size:12.5px;color:var(--gray-d);background:#fff;border-bottom:1px solid var(--gray)}
details.month{margin-bottom:14px}
details.month>summary{list-style:none;cursor:pointer;padding:12px 16px;background:#fff;border:1px solid var(--gray);border-radius:var(--r);font-weight:700;color:var(--navy);display:flex;justify-content:space-between;gap:8px;align-items:center}
details.month[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
details.month>summary::-webkit-details-marker{display:none}
details.month .card{border-top-left-radius:0;border-top-right-radius:0;margin-bottom:0;border-top:0}

/* Recordatorios */
.rem{padding:14px 16px;border-bottom:1px solid var(--gray);border-left:4px solid var(--gray);animation:fade .25s ease}
.rem:last-child{border-bottom:0}
.rem.p-alta{border-left-color:var(--red)}.rem.p-media{border-left-color:var(--blue)}.rem.p-baja{border-left-color:#b9c6d8}
.rem.alerting{background:var(--red-l)}
.rem.off{opacity:.65}
.rem h4{font-size:15.5px}
.rem .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* Historial / config */
.hist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--gray);font-size:14px}
.hist:last-child{border-bottom:0}
.hist .when{color:var(--gray-d);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{padding:16px}
.sec h4{color:var(--navy);margin-bottom:8px}
.def{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 16px;border-bottom:1px solid var(--gray)}
.def:last-child{border-bottom:0}
.def.arch{opacity:.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.fld{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:12px}
label.fld>input,label.fld>select,label.fld>textarea{display:block;width:100%;margin-top:5px;border:1px solid var(--gray);border-radius:10px;padding:9px 11px;background:#fff;font-weight:400}
textarea{resize:vertical}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{display:flex;gap:4px;align-items:center;border:1px solid var(--gray);border-radius:9px;padding:5px 9px;font-size:13px;background:#fff}
.note{background:var(--blue-xl);border:1px solid var(--gray);border-radius:10px;padding:10px 12px;font-size:13.5px;color:#34465f}

/* Modales */
.overlay{position:fixed;inset:0;background:rgba(11,42,74,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;animation:fade .18s ease}
.modal{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;animation:pop .2s ease}
.modal.wide{max-width:760px}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--gray)}
.m-head h3{font-size:17px;color:var(--navy)}
.x{border:0;background:none;color:var(--gray-d);border-radius:8px;padding:4px;display:grid;place-items:center}
.x:hover{background:var(--gray)}
.m-body{padding:16px 18px;overflow:auto}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--gray);flex-wrap:wrap}
.m-foot:empty{display:none}
.err{background:var(--red-l);color:#a82f2f;border-radius:9px;padding:8px 11px;font-size:13.5px;margin-top:6px;animation:shake .3s}
.cm{border:1px solid var(--gray);border-radius:12px;padding:10px 12px;margin-top:10px;background:#fff}
.cm .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--gray-d)}
.cm .tx{white-space:pre-wrap;margin:6px 0;word-break:break-word}
.cm .a{display:flex;gap:6px;flex-wrap:wrap}
.cm-new textarea{width:100%;border:1px solid var(--gray);border-radius:10px;padding:9px 11px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}

/* Alerta a pantalla casi completa */
.alert-ov{position:fixed;inset:0;z-index:3000;background:rgba(8,24,44,.82);display:flex;align-items:center;justify-content:center;padding:12px}
.alert{background:#fff;border-radius:20px;width:min(94vw,880px);min-height:min(78vh,620px);max-height:94vh;overflow:auto;display:flex;flex-direction:column;border-top:12px solid var(--blue);box-shadow:0 30px 90px rgba(0,0,0,.5);animation:pop .25s ease}
.alert.p-alta{border-top-color:var(--red)}.alert.p-baja{border-top-color:#9fb2cb}.alert.bind{border-top-color:var(--orange)}
.alert .a-head{padding:22px 28px 6px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.alert h2{font-size:clamp(24px,5vw,40px);line-height:1.15;color:var(--navy);padding:0 28px;word-break:break-word}
.alert .a-desc{padding:12px 28px;font-size:clamp(16px,2.4vw,20px);white-space:pre-wrap;flex:1}
.alert .a-when{padding:0 28px 14px;display:flex;gap:8px;flex-wrap:wrap}
.alert .a-foot{padding:18px 28px 22px;border-top:1px solid var(--gray);background:var(--blue-xl)}
.alert .a-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.alert .btn.big{font-size:18px;padding:13px 22px}
.alert .esc{margin-top:12px;font-size:12px}
.alert .esc button{background:none;border:0;color:var(--gray-d);text-decoration:underline;padding:0;font-size:12px}
.alert-chip{position:fixed;right:12px;bottom:12px;z-index:3000}
#toasts{position:fixed;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4000;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .2s ease;max-width:92vw;pointer-events:auto}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .lbl{display:none}
  .stat.wide{grid-column:span 2}
  .clock .t{font-size:22px}
  .task{grid-template-columns:auto 1fr;}
  .task .t-act{grid-column:1 / -1;justify-content:flex-start}
  main{padding:12px}
}
body.focus .stats .opt{display:none}

/* Cajón desplegable de estados */
.drawer{background:var(--blue-xl);border-bottom:1px solid var(--gray);border-left:4px solid var(--navy);padding:12px 16px 14px;animation:drawer .22s ease;transform-origin:top}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:700;color:var(--navy);font-size:14px}
.drawer .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt-st{display:flex;align-items:center;gap:8px;border:2px solid var(--gray);background:#fff;border-radius:11px;padding:10px 12px;font-weight:600;text-align:left}
.opt-st i{width:12px;height:12px;border-radius:50%;background:#b9c6d8;flex:none}
.opt-st.s-en_curso i{background:var(--blue)}.opt-st.s-seguimiento i{background:var(--orange)}.opt-st.s-completada i{background:var(--green)}
.opt-st:hover{border-color:var(--navy)}
.opt-st.cur{border-color:var(--navy);background:var(--blue-l);cursor:default}
.drawer .hint{font-size:12.5px;color:var(--gray-d);margin-top:8px}
.chk{position:relative}
@keyframes drawer{from{opacity:0;transform:scaleY(.85)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="top-row">
    <div class="brand"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg> Checklist administrativo</div>
    <div class="clock"><div class="t" id="clockT">--:--:--</div><div class="d" id="clockD"></div></div>
  </div>
  <div class="stats">
    <div class="stat wide"><div class="l">Checklist diario completado</div><div class="v" id="stPct">0%</div><div class="bar"><i id="stBar" style="width:0%"></i></div></div>
    <div class="stat"><div class="l">Pendientes</div><div class="v" id="stPend">0</div></div>
    <div class="stat"><div class="l">Vencidas</div><div class="v" id="stOver">0</div></div>
    <div class="stat wide opt"><div class="l">Próximo recordatorio</div><div class="v sm" id="stNext">—</div></div>
  </div>
  <div class="top-actions">
    <button class="btn light" data-top="newRem"></button>
    <button class="btn light" data-top="summary"></button>
    <button class="btn light" data-top="focus" id="btnFocus"></button>
  </div>
</div></header>
<div id="banners"></div>
<nav class="nav"><div class="nav-in" id="nav" role="tablist"></div></nav>
<main id="main"></main>
<div id="modalRoot"></div>
<div id="alertRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* =========================================================
   ARQUITECTURA (un solo archivo, secciones):
   1) Utilidades   2) Base de datos (IndexedDB)   3) Estado y persistencia
   4) Reglas (estados, períodos, vencimientos)  5) Historial
   6) Interfaz base (modales, avisos)  7) Vistas  8) Comentarios
   9) Recordatorios y alertas  10) Configuración, respaldos  11) Arranque
   ========================================================= */

/* ---------- 1) Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
let clock = () => Date.now();
const nowTs = () => clock();
const nowD = () => new Date(clock());
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const hhmm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const snippet = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDay = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtDT = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${fmtTime(ts)}`; };
const monthLabel = p => { const [y, m] = p.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-AR', {month: 'long', year: 'numeric'}); };
function fmtWhen(ts) {
  const d = new Date(ts), t = nowD(), a = ymd(d), b = ymd(t);
  const tm = new Date(t); tm.setDate(tm.getDate() + 1);
  if (a === b) return `hoy ${fmtTime(ts)}`;
  if (a === ymd(tm)) return `mañana ${fmtTime(ts)}`;
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${fmtTime(ts)}`;
}
const DOW = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const PRI = {baja: 1, media: 2, alta: 3};
const STATUS = {
  pendiente: {label: 'Pendiente', cls: ''},
  en_curso: {label: 'En curso', cls: 'blue'},
  completada: {label: 'Completada', cls: 'green'},
  seguimiento: {label: 'Requiere seguimiento', cls: 'orange'},
  vencida: {label: 'Vencida', cls: 'red'}
};
const ICONS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  chat: '<path d="M20 15a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/>',
  bell: '<path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16z"/><path d="M10 21h4"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',

const STORES = ['taskDefs', 'instances', 'comments', 'reminders', 'history', 'meta'];
const DB = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      try {
        const req = indexedDB.open('checklist-admin-v1', 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath: s === 'meta' ? 'key' : 'id'}); });
        };
        req.onsuccess = e => { this.db = e.target.result; this.ok = true; res(true); };

  getAll(s) { return new Promise((res, rej) => { const r = this.db.transaction(s, 'readonly').objectStore(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _w(s, fn) {

  },
  put(s, o) { return this._w(s, os => os.put(o)); },
  putMany(s, arr) { return this._w(s, os => arr.forEach(o => os.put(o))); },
  del(s, id) { return this._w(s, os => os.delete(id)); },
  replaceAll(d) {
    if (!this.ok) return Promise.resolve();
    return new Promise((res, rej) => {
      const t = this.db.transaction(STORES, 'readwrite');
      STORES.forEach(s => { const os = t.objectStore(s); os.clear(); (d[s] || []).forEach(o => os.put(o)); });
      t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);

  }
};

  const defs = DAILY_SEED.map((n, k) => mk('D' + (k + 1), 'daily', n, k + 1, k === 7 ? 'bind' : null))

/* ---------- 4) Reglas: períodos, estados, vencimientos ---------- */
const defOf = i => S.defs.find(d => d.id === i.defId);
const visible = i => { const d = defOf(i); return !!d && !d.archived; };
function bindSlots() {
  const b = cfg().bind, out = [];

  return out;
}
function lastDayOf(p) { const [y, m] = p.split('-').map(Number); return daysIn(y, m - 1); }
function computeDue(def, period) {
  const o = def.due || {mode: 'none'}, [y, m] = period.split('-').map(Number), last = daysIn(y, m - 1);
  if (o.mode === 'day') return `${period}-${pad(Math.min(Math.max(1, o.day | 0), last))}`;
  if (o.mode === 'last') return `${period}-${pad(last)}`;
  if (o.mode === 'lastbiz') {
    const hol = new Set(cfg().holidays);
    let d = last;
    while (d > 1) { const dt = new Date(y, m - 1, d), k = `${period}-${pad(d)}`; if (dt.getDay() !== 0 && dt.getDay() !== 6 && !hol.has(k)) break; d--; }
    return `${period}-${pad(d)}`;
  }

}
function newInstance(def, period, slot) {
  return {
    id: `${def.id}|${period}|${slot || ''}`, defId: def.id, type: def.type, period, slot: slot || '', name: def.name,
    status: 'pendiente', completedAt: null, due: def.type === 'monthly' ? computeDue(def, period) : null,
    dueManual: false, createdAt: nowTs(), alerted: false

}
function addInst(def, period, slot, bucket) {
  const inst = newInstance(def, period, slot);

}
function monthsToGenerate(cur) {
  const from = S.meta.lastMonth && S.meta.lastMonth < cur ? S.meta.lastMonth : cur, out = [];
  let [y, m] = from.split('-').map(Number);
  for (let k = 0; k < 12; k++) {

    if (p >= cur) break;

  }

}
function ensurePeriods() {
  const d = nowD(), today = ymd(d), cur = ymOf(d), added = [];

    if (def.archived) continue;

      else addInst(def, today, '', added);

}

  const gone = S.inst.filter(i => i.defId === def.id && i.period === today && !want.includes(i.slot) && i.status !== 'completada' && !commentsOf('instance', i.id).length);
  gone.forEach(i => { S.inst.splice(S.inst.indexOf(i), 1); S.ids.delete(i.id); remove('instances', i.id); });

const slotTs = i => { const d = parseYmd(i.period); d.setHours(0, toMin(i.slot), 0, 0); return d.getTime(); };

}

function stepTs(base, unit, every, n, anchor) {
  const d = new Date(base);
  if (unit === 'month') {
    const t = d.getMonth() + every * n, y = d.getFullYear() + Math.floor(t / 12), mo = ((t % 12) + 12) % 12;
    return new Date(y, mo, Math.min(anchor || d.getDate(), daysIn(y, mo)), d.getHours(), d.getMinutes()).getTime();
  }
  d.setDate(d.getDate() + every * n); return d.getTime();
}
/* Primera ocurrencia estrictamente posterior a max(ahora, baseAt). */
function nextOccurrence(r) {
  const rp = r.repeat; if (rp.type === 'none') return null;
  let unit, every;
  if (rp.type === 'daily') { unit = 'day'; every = 1; } else if (rp.type === 'weekly') { unit = 'day'; every = 7; }
  else if (rp.type === 'monthly') { unit = 'month'; every = 1; }
  else { unit = rp.unit; every = Math.max(1, rp.every | 0); if (unit === 'week') { unit = 'day'; every *= 7; } }
  const target = Math.max(nowTs(), r.baseAt);
  if (unit === 'min' || unit === 'hour') { const step = every * (unit === 'min' ? 60000 : 3600000); return r.baseAt + (Math.floor((target - r.baseAt) / step) + 1) * step; }
  let n = 1, c = stepTs(r.baseAt, unit, every, n, r.anchorDay);
  while (c <= target && n < 20000) { n++; c = stepTs(r.baseAt, unit, every, n, r.anchorDay); }
  return c;
}
function fireReminder(r) {

}
function checkReminders() {

  S.rems.forEach(r => { if ((r.state === 'active' || r.state === 'snoozed') && !r.alerting && r.nextAt <= nowTs()) { fireReminder(r); fired = true; } });
  return fired;
}
function confirmReminder(r) {

}
function snoozeReminder(r, min) {

}

function alertQueue() {

      <div class="a-foot"><div class="a-btns"><button class="btn primary big" data-alert="bindClose">Entendido, cerrar aviso</button>${snz.map(m => `<button class="btn ghost" data-alert="bindSnooze" data-min="${m}">Recordar en ${m} min</button>`).join('')}</div>${esc2}</div></div></div>`;

async function settingsAction(a, el) {

      if (o) { [def.order, o.order] = [o.order, def.order]; save('taskDefs', def); save('taskDefs', o); S.defs.sort((x, y) => x.order - y.order); log('tarea_modificada', {def, detail: 'Cambio de orden'}); refresh(true); } break; }
    case 'archive':

        const ins = S.inst.filter(i => i.defId === def.id), ids = new Set(ins.map(i => i.id));
        ins.forEach(i => remove('instances', i.id));
        S.inst = S.inst.filter(i => !ids.has(i.id)); reindex();
        S.comments.filter(c => c.parentKind === 'instance' && ids.has(c.parentId)).forEach(c => remove('comments', c.id));
        S.comments = S.comments.filter(c => !(c.parentKind === 'instance' && ids.has(c.parentId)));
        S.rems.forEach(r => { if (r.defId === def.id) { r.defId = null; r.instId = null; save('reminders', r); } });
        S.defs.splice(S.defs.indexOf(def), 1); remove('taskDefs', def.id);
        log('tarea_modificada', {def, detail: 'Tarea eliminada'}); refresh(true);
      } break;
    case 'notif':

      { const p = await Notification.requestPermission(); cfg().sysNotif = p === 'granted'; await saveSettings(); toast(p === 'granted' ? 'Notificaciones activadas' : 'Permiso no concedido', p === 'granted' ? 'ok' : 'err'); refresh(true); }
      break;

    case 'import': $('#fileImp').click(); break;

}
function handleSetting(t) {
  const k = t.dataset.set, c = cfg(), b = Object.assign({}, c.bind), bad = msg => { toast(msg, 'err'); refresh(true); };
  switch (k) {
    case 'bind.start': case 'bind.end': {
      b[k.split('.')[1]] = t.value; if (!t.value || toMin(b.start) >= toMin(b.end)) return bad('La hora de inicio debe ser anterior a la de finalización.'); break; }
    case 'bind.interval': {
      const v = parseInt(t.value, 10); if (!(v >= 5 && v <= 480)) return bad('El intervalo debe estar entre 5 y 480 minutos.');
      b.interval = v; if ((toMin(b.end) - toMin(b.start)) / v > 100) return bad('Demasiadas revisiones por día.'); break; }
    case 'bind.day': { const v = Number(t.dataset.v); b.days = t.checked ? [...new Set([...b.days, v])].sort() : b.days.filter(x => x !== v); break; }
    case 'bind.pending': b.pending = t.value; break;
    case 'snooze': {
      const arr = t.value.split(/[,\s]+/).map(Number).filter(n => n >= 1 && n <= 10080);
      if (!arr.length) return bad('Ingresá al menos un intervalo válido (minutos).'); c.snooze = [...new Set(arr)].slice(0, 6); break; }
    case 'snoozeCustom': { const v = parseInt(t.value, 10); if (!(v >= 1 && v <= 10080)) return bad('Valor inválido.'); c.snoozeCustom = v; break; }
    case 'sound': c.sound = t.checked; break;
    case 'holidays': {
      const lines = t.value.split(/\s+/).filter(Boolean);
      if (lines.some(l => !/^\d{4}-\d{2}-\d{2}$/.test(l) || isNaN(parseYmd(l)))) return bad('Hay feriados con formato inválido (usá AAAA-MM-DD).');
      c.holidays = [...new Set(lines)].sort();
      S.inst.filter(i => i.type === 'monthly' && i.status !== 'completada' && !i.dueManual).forEach(i => { const d = defOf(i); if (d) { i.due = computeDue(d, i.period); save('instances', i); } }); break; }
  }
  if (k.startsWith('bind.')) { c.bind = b; syncBindToday(); log('tarea_modificada', {task: 'Revisión del BIND', detail: `Configuración: ${b.start}–${b.end} cada ${b.interval} min`}); }
  saveSettings(); refresh(true);
}
function exportBackup() {
  const data = {app: 'checklist-admin', version: 1, exportedAt: new Date().toISOString(), data: {
    taskDefs: S.defs, instances: S.inst, comments: S.comments, reminders: S.rems, history: S.hist,
    meta: Object.entries(S.meta).map(([key, value]) => ({key, value}))}};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `respaldo-checklist-${ymd(nowD())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setMeta('lastBackup', nowTs()); log('sistema', {task: 'Respaldo', detail: 'Exportación de datos'}); toast('Respaldo exportado', 'ok'); refresh(true);
}
function validateBackup(o) {
  const errs = [], isO = x => x && typeof x === 'object' && !Array.isArray(x);
  if (!isO(o) || o.app !== 'checklist-admin') return ['El archivo no es un respaldo de esta aplicación.'];
  if (typeof o.version !== 'number' || o.version > 1) errs.push('Versión de respaldo no compatible.');
  const d = o.data; if (!isO(d)) return errs.concat('Falta el bloque de datos.');
  for (const k of STORES) if (!Array.isArray(d[k])) errs.push(`Falta la sección “${k}” o no es una lista.`);
  if (errs.length) return errs;
  const chk = (arr, name, fn) => arr.forEach((x, n) => { if (!isO(x) || typeof (name === 'meta' ? x.key : x.id) !== 'string' || !fn(x)) errs.push(`${name} #${n + 1}: registro inválido.`); });
  chk(d.taskDefs, 'taskDefs', x => ['daily', 'monthly'].includes(x.type) && typeof x.name === 'string' && typeof x.order === 'number');
  chk(d.instances, 'instances', x => typeof x.defId === 'string' && typeof x.period === 'string' && Object.keys(STATUS).includes(x.status));
  chk(d.comments, 'comments', x => typeof x.text === 'string' && typeof x.parentId === 'string' && typeof x.createdAt === 'number');
  chk(d.reminders, 'reminders', x => typeof x.title === 'string' && typeof x.baseAt === 'number' && typeof x.nextAt === 'number' && isO(x.repeat) && ['baja', 'media', 'alta'].includes(x.priority));
  chk(d.history, 'history', x => typeof x.ts === 'number' && typeof x.type === 'string');
  chk(d.meta, 'meta', () => true);
  return errs;
}
async function importFile(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { return showImportErr(['El archivo no es un JSON válido.']); }
  const errs = validateBackup(obj); if (errs.length) return showImportErr(errs);
  const d = obj.data;
  const ok = await confirmDlg('Importar respaldo', `Se <b>reemplazarán todos los datos actuales</b> por los del archivo (${d.taskDefs.length} tareas, ${d.instances.length} instancias, ${d.comments.length} comentarios, ${d.reminders.length} recordatorios, ${d.history.length} eventos; respaldo del ${esc(String(obj.exportedAt || '').slice(0, 10))}). Esta acción no se puede deshacer; si querés conservar lo actual, exportalo primero.`, 'Reemplazar datos', true);
  if (!ok) return;
  try {
    const meta = d.meta.slice(); if (!meta.some(m => m.key === 'seeded')) meta.push({key: 'seeded', value: true});
    await DB.replaceAll({taskDefs: d.taskDefs, instances: d.instances, comments: d.comments, reminders: d.reminders, history: d.history, meta});
    if (!DB.ok) { S.defs = d.taskDefs; S.inst = d.instances; S.comments = d.comments; S.rems = d.reminders; S.hist = d.history; S.meta = Object.fromEntries(meta.map(m => [m.key, m.value])); S.meta.settings = Object.assign(DEFAULT_SETTINGS(), S.meta.settings || {}); reindex(); }
    else await loadState();
    ensurePeriods(); log('sistema', {task: 'Respaldo', detail: 'Importación de datos'}); broadcast(); refresh(true); renderAlerts(); toast('Respaldo importado correctamente', 'ok');
  } catch (e) { showImportErr(['No se pudo escribir en el almacenamiento: ' + ((e && e.message) || e)]); }
}
function showImportErr(errs) {
  openModal({title: 'No se pudo importar', html: `<p style="margin-top:0">El archivo fue rechazado y <b>no se modificó ningún dato</b>.</p><ul>${errs.slice(0, 6).map(e => `<li>${esc(e)}</li>`).join('')}</ul>${errs.length > 6 ? `<div class="muted small">…y ${errs.length - 6} problema(s) más.</div>` : ''}`, actions: [{label: 'Cerrar', cls: 'primary'}]});
}

function updateClock() {
  const d = nowD(); $('#clockT').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function tick() {
  try {
    updateClock();
    const day = ymd(nowD());
    if (day !== RT.day) { RT.day = day; ensurePeriods(); refresh(); }
    const f = checkReminders(); checkBind();
    renderAlerts();
    const min = Math.floor(nowTs() / 60000);
    if (min !== RT.minute || f) { RT.minute = min; refresh(); }
  } catch (e) {
    console.error(e);
    if (nowTs() - RT.lastErr > 5000) { RT.lastErr = nowTs(); toast('Ocurrió un error interno. Podés seguir usando la app.', 'err'); }
  }
}
window.addEventListener('error', () => { /* una falla no debe dejar la pantalla bloqueada */ if (!$('#alertRoot').querySelector('[data-alert]')) $('#alertRoot').innerHTML = ''; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
window.addEventListener('focus', tick);
